name: alpha_translator
description: "Traducteur Radio et Morse Professionnel"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/

# Configuration de l'icône (Écran d'accueil)
flutter_native_splash:
  # On utilise un bleu très proche du bord de ton icône
  color: "#0D1233"
  image: "assets/icon.png"

  android_12:
    color: "#0D1233"
    image: "assets/icon.png"
    # On force le cercle Android à prendre cette couleur
    icon_background_color: "#0D1233"

  android: true
  ios: true
  fullscreen: true